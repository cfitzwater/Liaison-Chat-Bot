<!DOCTYPE html>
<html>
<head>
    <title>Change Password</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; display: flex; justify-content: center; padding-top: 100px; }
        .box { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 350px; }
        h2 { color: #0C0050; text-align: center; margin-bottom: 25px; }
        
        /* Error Message Styling */
        .error-msg { 
            color: #d32f2f; 
            background: #ffebee; 
            padding: 12px; 
            border-radius: 4px; 
            margin-bottom: 20px; 
            font-size: 0.9rem; 
            text-align: center; 
            border: 1px solid #ffcdd2; 
        }

        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; font-size: 1rem; }
        button { 
            width: 100%; 
            padding: 12px; 
            background: #0C0050; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 1rem; 
            margin-top: 10px;
        }
        button:hover { background: #3388DD; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Change Your Password</h2>
        <p style="text-align: center; color: #666; margin-bottom: 20px;">Your password has been reset. Please choose a new password.</p>

        {% if error %}
            <div class="error-msg">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">
            <input type="password" name="new_password" placeholder="New Password" required autofocus>
            <input type="password" name="confirm_password" placeholder="Confirm New Password" required>
            <button type="submit">Change Password</button>
        </form>
    </div>
</body>
</html>
