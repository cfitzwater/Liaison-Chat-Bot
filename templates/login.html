<!DOCTYPE html>
<html>
<head>
    <title>Liaison Login</title>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; display: flex; justify-content: center; padding-top: 100px; }
        .box { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 300px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #0C0050; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <h2 style="color:#0C0050">Liaison Login</h2>
        <form method="POST">
            <input type="email" name="email" placeholder="Email (Username)" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        <p>New? <a href="/signup">Create Account</a></p>
    </div>
</body>
</html>
