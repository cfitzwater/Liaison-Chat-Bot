<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Liaison Bot - Create Account</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; display: flex; justify-content: center; padding-top: 80px; }
        .box { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 350px; }
        header { text-align: center; margin-bottom: 20px; }
        h2 { color: #0C0050; margin: 0; }
        label { display: block; margin: 10px 0 5px; font-weight: bold; color: #333; font-size: 0.9rem; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; font-size: 1rem; }
        button { width: 100%; padding: 12px; background: #3388DD; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 1rem; }
        button:hover { background: #0C0050; }
        .footer-links { text-align: center; margin-top: 20px; font-size: 0.85rem; }
        a { color: #3388DD; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="box">
        <header>
            <h2>Create Account</h2>
            <p style="color: #666; font-size: 0.9rem;">Join the Liaison Library Team</p>
        </header>
        
        <form action="/signup" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <label for="first_name">First Name</label>
            <input type="text" id="first_name" name="first_name" placeholder="John" required>

            <label for="last_name">Last Name</label>
            <input type="text" id="last_name" name="last_name" placeholder="Doe" required>

            <label for="email">Email Address (Username)</label>
            <input type="email" id="email" name="email" placeholder="j.doe@intermountain.org" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>

            <button type="submit">Register</button>
        </form>
        
        <div class="footer-links">
            Already have an account? <a href="/login">Log In</a>
        </div>
    </div>
</body>
</html>
