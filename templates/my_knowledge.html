<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Knowledge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        #editModal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; }
        .modal-body { background:white; margin:10% auto; padding:20px; width:50%; border-radius:8px; }
    </style>
</head>
<body class="bg-light p-5">
    <div class="container bg-white p-4 shadow rounded">
        <h3>Your Knowledge Contributions</h3>
        <p>Manage, edit, or delete your entries below.</p>
        <a href="/" class="btn btn-secondary mb-3">Back to Chat</a>

        <table class="table">Gemini logo
            {% for entry in entries %}
            <tr id="row-{{ entry.id }}">
                <td>{{ entry.notes }}</td>
                <td>
                    <button class="btn btn-primary btn-sm" onclick="openEdit('{{ entry.id }}', `{{ entry.notes }}`)">Edit</button>
                    <button class="btn btn-danger btn-sm" onclick="deleteMe('{{ entry.id }}')">Delete</button>
                </td>
            </tr>
            {% endfor %}
        </table>
    </div>

    <div id="editModal">
        <div class="modal-body">
            <h3>Edit Entry</h3>
            <textarea id="editText" rows="8" style="width:100%"></textarea><br><br>
            <button class="btn btn-primary" onclick="saveEdit()">Save Changes</button>
            <button class="btn btn-secondary" onclick="closeEdit()">Cancel</button>
        </div>
    </div>

    <script>
        let activeId = null;
        function openEdit(id, text) { activeId = id; document.getElementById('editText').value = text; document.getElementById('editModal').style.display='block'; }
        function closeEdit() { document.getElementById('editModal').style.display='none'; }
        
        async function saveEdit() {
            const notes = document.getElementById('editText').value;
            await fetch(`/edit_my_knowledge/${activeId}`, {
                method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({notes})
            });
            location.reload();
        }
        async function deleteMe(id) {
            if(confirm("Delete your entry?")) {
                const res = await fetch(`/admin/delete_entry/${id}`, {method:'POST'});
                if(res.ok) document.getElementById('row-'+id).remove();
            }
        }
    </script>
</body>
</html>
